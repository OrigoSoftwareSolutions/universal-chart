name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.0

      - name: Lint
        run: helm lint universal-chart/ --strict

      - name: Install kubeconform
        run: |
          curl -sLO https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform-linux-amd64.tar.gz
          sudo mv kubeconform /usr/local/bin/

      - name: Schema validation
        run: |
          helm template test universal-chart/ -f universal-chart/ci/test-values.yaml \
            | kubeconform \
              -strict \
              -ignore-missing-schemas \
              -kubernetes-version 1.33.6 \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'

  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.0

      - name: Install helm-unittest plugin
        # --verify=false required on Helm 4: GPG verification of git plugin
        # sources is not supported. See helm-unittest README and issue #785.
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version 1.1.2 --verify=false

      - name: Run unit tests
        run: helm unittest universal-chart/ --strict --file 'tests/*.yaml'

  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check values doc-comment coverage
        run: |
          awk '
          BEGIN { in_comment = 0; has_doc = 0; missing = 0 }
          /^[[:space:]]*$/ { in_comment = 0; has_doc = 0; next }
          /^#/ {
            in_comment = 1
            if ($0 ~ /^# --([[:space:]].*)?$/) has_doc = 1
            next
          }
          /^[A-Za-z][A-Za-z0-9]*:/ {
            key = $0
            sub(/:.*/, "", key)
            if (!in_comment || !has_doc) {
              print key
              missing = 1
            }
            in_comment = 0
            has_doc = 0
            next
          }
          { in_comment = 0; has_doc = 0 }
          END {
            if (missing) {
              print "ERROR: Missing '# --' doc comments for top-level keys in universal-chart/values.yaml:" > "/dev/stderr"
              exit 1
            }
          }
          ' universal-chart/values.yaml

      - name: Install helm-docs
        run: |
          curl -sLO https://github.com/norwoodj/helm-docs/releases/download/v1.14.2/helm-docs_1.14.2_Linux_x86_64.tar.gz
          tar -xzf helm-docs_1.14.2_Linux_x86_64.tar.gz helm-docs
          sudo mv helm-docs /usr/local/bin/

      - name: Check docs are up to date
        run: |
          helm-docs --chart-search-root universal-chart/ --sort-values-order=file
          cp universal-chart/README.md README.md
          git diff --exit-code README.md universal-chart/README.md
          test -z "$(git status --porcelain README.md universal-chart/README.md)" \
            || (echo "ERROR: README.md or universal-chart/README.md is out of date/untracked. Run 'helm-docs --chart-search-root universal-chart/ --sort-values-order=file && cp universal-chart/README.md README.md' locally and commit both files." && exit 1)
